services:
  # --- PostgreSQL 18 Core Engine ---
  postgres:
    image: postgres:18-alpine
    container_name: debrief-postgres
    restart: always
    environment:
      POSTGRES_USER: debrief_user
      POSTGRES_PASSWORD: debrief_password
      POSTGRES_DB: debrief_production
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debrief_user -d debrief_production"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- Short-lived Database Schema Migrator ---
  db-migrate:
    image: debrief-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: debrief-migrator
    command: ["node", "migrate.mjs"]
    environment:
      - CI=true
      - DATABASE_URL=postgresql://debrief_user:debrief_password@debrief-postgres:5432/debrief_production
    depends_on:
      postgres:
        condition: service_healthy

  # --- RustFS Volume Permission Fixer ---
  rustfs-permission-helper:
    image: alpine:latest
    container_name: debrief-rustfs-permission-helper
    volumes:
      - miniodata:/data
      - rustfs_logs:/app/logs
    command: >
      sh -c "
        chown -R 10001:10001 /data /app/logs &&
        echo 'Volume Permissions fixed' &&
        exit 0
      "
    restart: "no"

  # --- RustFS S3 Object Storage Engine ---
  rustfs:
    image: rustfs/rustfs:latest
    container_name: debrief-rustfs
    restart: always
    depends_on:
      rustfs-permission-helper:
        condition: service_completed_successfully
    security_opt:
      - "no-new-privileges:true"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=debrief_user
      - RUSTFS_SECRET_KEY=debrief_password
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs
    volumes:
      - miniodata:/data
      - rustfs_logs:/app/logs
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console Dashboard UI
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- RustFS Provisioner & Permissions Sidecar ---
  rustfs-init:
    image: rustfs/rc:latest
    container_name: debrief-rustfs-init
    environment:
      RUSTFS_ROOT_USER: debrief_user
      RUSTFS_ROOT_PASSWORD: debrief_password
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      rc alias set myrustfs http://debrief-rustfs:9000 $$RUSTFS_ROOT_USER $$RUSTFS_ROOT_PASSWORD;
      rc mb --ignore-existing myrustfs/debrief;
      rc anonymous set download myrustfs/debrief/events;
      rc anonymous set download myrustfs/debrief/avatars;
      exit 0;
      "

  # --- Nuxt Server ---
  web:
    image: debrief-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: debrief-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: 58a32fdca7e7285d516247c668589b1ab3c5e58168ef6efdae7a1dfc39401dff
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://debrief_user:debrief_password@debrief-postgres:5432/debrief_production
      NODE_ENV: production
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      S3_ENDPOINT: http://debrief-rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: debrief_user
      S3_SECRET_ACCESS_KEY: debrief_password
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  rustfs_logs:
    driver: local
