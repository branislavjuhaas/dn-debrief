services:
  # --- PostgreSQL 18 Core Engine ---
  postgres:
    image: postgres:18-alpine
    container_name: debrief-postgres
    restart: always
    environment:
      POSTGRES_USER: debrief_user
      POSTGRES_PASSWORD: debrief_password
      POSTGRES_DB: debrief_production
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debrief_user -d debrief_production"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- Short-lived Database Schema Migrator ---
  db-migrate:
    image: debrief-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: debrief-migrator
    command: ["node", "migrate.mjs"]
    environment:
      - CI=true
      - DATABASE_URL=postgresql://debrief_user:debrief_password@debrief-postgres:5432/debrief_production
    depends_on:
      postgres:
        condition: service_healthy

  # --- MinIO S3 Object Storage Engine ---
  minio:
    image: minio/minio:latest
    container_name: debrief-minio
    restart: always
    environment:
      MINIO_ROOT_USER: debrief_user
      MINIO_ROOT_PASSWORD: debrief_password
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Storage Console Dashboard UI
    healthcheck:
      test:
        ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # --- MinIO Provisioner & Permissions Sidecar ---
  minio-init:
    image: minio/mc:latest
    container_name: debrief-minio-init
    environment:
      MINIO_ROOT_USER: debrief_user
      MINIO_ROOT_PASSWORD: debrief_password
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://debrief-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb --ignore-existing myminio/debrief;
      /usr/bin/mc anonymous set-json '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicReadAvatarsAndEvents\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::debrief/avatars/*\",\"arn:aws:s3:::debrief/events/*\"]}]}' myminio/debrief;
      exit 0;
      "

  # --- Nuxt Server ---
  web:
    image: debrief-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: debrief-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: 58a32fdca7e7285d516247c668589b1ab3c5e58168ef6efdae7a1dfc39401dff
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://debrief_user:debrief_password@debrief-postgres:5432/debrief_production
      NODE_ENV: production
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      S3_ENDPOINT: http://debrief-minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: debrief_user
      S3_SECRET_ACCESS_KEY: debrief_password
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
