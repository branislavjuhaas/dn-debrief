name: Build, Push, and Deploy Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # Keeps your image name dynamic and perfectly matching your lowercase repo
  IMAGE_NAME: ghcr.io/${{ github.repository }}-web

jobs:
  quality-assurance:
    uses: ./.github/workflows/check.yml

  build-and-push:
    needs: quality-assurance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Monorepo Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
