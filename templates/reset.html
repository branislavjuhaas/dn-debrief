<!-- HTML Code for DebRIEF Email Templates -->
<!DOCTYPE html>
<html>

<head>
    <!-- Author: Branislav Juhás (DN DB Coded) -->
    <!-- Date: 2024-08-02 | Version: 1.3 -->
    <!-- Description: HTML Code for Registration Confirmation Page For SDA Registration -->
    <!-- Modified Version of the HTML Code for Registration Confirmation Page by Branislav Juhás -->

    <!-- Including Google Fonts for Styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;550;600;700&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Reset</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Internal CSS Styles -->
    <style type="text/css">
        /* Styling for the confirmation dialog */
        .dialog {
            background-color: #FFFFFF;
            border: 5px solid #000000;
            border-radius: 35px;
            height: 500px;
            padding: 35px;
            margin: 30px;
            width: 390px;
        }

        /* Offset for vertical centering */
        .offset {
            height: calc(100vh / 2 - 500px);
        }

        /* Styling for the background */
        .background {
            background-color: #21D46E;
            min-width: 300px;
        }

        /* Styling for the title */
        .title {
            font-family: 'Epilogue', sans-serif;
            font-weight: 700;
            text-align: left;
            font-size: 45px;
            color: #000000;
        }

        /* Styling for the triangle icon */
        .triangle {
            margin-left: 7px;
            height: 42px;
        }

        /* Styling for the SDA logo link */
        .logolink {
            align-items: baseline;
            flex-direction: row;
            display: flex;
        }

        /* Styling for the SDA logo */
        .sdalogo {
            font-family: 'Epilogue', sans-serif;
            text-decoration: none;
        }

        /* Styling for the content section */
        .content {
            margin-top: 30px;
            height: 348px;
            width: 100%;
        }

        /* Styling for the confirmation message */
        .confirmation {
            font-family: 'Epilogue', sans-serif;
            text-align: justify;
            line-height: 17px;
            font-weight: 400;
            font-size: 17px;
            color: #000000;
        }

        /* Styling for the bold text */
        .bold {
            font-weight: 550;
        }

        /* Styling for the confirmation button link */
        .confirmlink {
            text-decoration: none;
            margin-left: 100px;
            display: contents;
            padding-top: 4px;
        }

        /* Styling for the confirmation button */
        .confirmbtn {
            font-family: 'Epilogue', sans-serif;
            background-color: #FFD900;
            border-radius: 35px;
            text-align: center;
            font-weight: 600;
            font-size: 30px;
            color: #000000;
            margin-top: 104px;
            padding: 10px;
            width: 300px;
        }

        /* Resetting text size adjustments */
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        a {
            text-decoration: none;
            color: #000000 !important;
        }

        /* Collapse table borders */
        table {
            border-collapse: collapse;
            height: 98vh;
            width: 100%;
        }

        /* Removing margins from certain divs */
        div[style*="margin: 16px 0;"] {
            margin: 0 !important;
        }

        /* Adjusting image interpolation mode */
        img {
            -ms-interpolation-mode: bicubic;
        }

        /* Styling for Apple data detectors */
        a[x-apple-data-detectors] {
            text-decoration: none !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
            font-size: inherit !important;
            color: inherit !important;
        }

        /* Media queries for responsiveness */
        @media screen and (max-width: 550px) {
            .dialog {
                background-color: transparent;
                width: auto;
                border: none;
                margin: 0px;
            }

            .background {
                background-color: #FFFFFF;
            }
        }

        @media screen and (max-width: 405px) {
            .title {
                font-size: 35px;
            }

            .triangle {
                margin-left: 6px;
                height: 35px;
            }

            .dialog {
                padding: 25px;
            }

            .code {
                font-size: 30px;
            }

            .confirmation {
                font-size: 15px;
            }

            .sdalogo {
                height: 40px;
            }

            .confirmbtn {
                font-size: 25px;
                width: 200px;
            }
        }
    </style>
</head>

<body class="background">
<!-- Creating a table for layout -->
<table>
    <!-- Creating an offset row for vertical centering -->
    <tr class="offset"></tr>
    <tr>
        <td align="center">
            <!-- Main content dialog -->
            <div class="dialog">
                <!-- Link to external website with logo -->
                <a class="logolink" href="https://www.debrief.sda.sk/" target="_blank">
                    <img class="sdalogo" src="https://www.sda.sk/wp-content/uploads/2024/08/debrief.png" height="42px" alt="SDA Logo"/>
                </a>
                <!-- Content section -->
                <div class="content">
                    <!-- Registration confirmation message -->
                    <p class="confirmation">
                        Dobrý deň %DISPLAY_NAME%, zaznamenali sme Vašu požiadavku na obnovenie hesla pre váš účet v systéme DebRIEF. Pre obnovenie hesla kliknite na tlačidlo nižšie.
                    </p>
                    <!-- Confirmation button with link -->
                    <a class="confirmlink" href="%LINK%" target="_blank">
                        <p class="confirmbtn">Obnoviť heslo</p>
                    </a>
                </div>
                <h1 class="title">Reset<img src="https://www.sda.sk/wp-content/uploads/2023/09/Rectangle.png" class="triangle" /></h1>
            </div>
        </td>
    </tr>
</table>
</body>
</html>
