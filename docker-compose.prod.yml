version: "3.8"

services:
  # --- PostgreSQL 18 Core Engine ---
  postgres:
    image: postgres:18-alpine
    container_name: debrief-postgres
    restart: always
    environment:
      POSTGRES_USER: debrief_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: debrief_production
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - dokploy-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debrief_user -d debrief_production"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- Short-lived Database Schema Migrator ---
  db-migrate:
    image: ghcr.io/branislavjuhaas/dn-debrief-web:latest
    container_name: debrief-migrator
    working_dir: /app/packages/db
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile --ignore-scripts &&
      pnpm --filter @dn-debrief/db exec drizzle-kit migrate --config=drizzle.config.ts"
    environment:
      DATABASE_URL: postgresql://debrief_user:${DATABASE_PASSWORD}@debrief-postgres:5432/debrief_production
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy

  # --- MinIO S3 Object Storage Engine ---
  minio:
    image: minio/minio:latest
    container_name: debrief-minio
    restart: always
    environment:
      MINIO_ROOT_USER: debrief_user
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - dokploy-network
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Storage Console Dashboard UI
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 3

  # --- Nuxt Server ---
  web:
    image: ghcr.io/branislavjuhaas/dn-debrief-web:latest
    container_name: debrief-web
    restart: always
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      DATABASE_URL: postgresql://debrief_user:${DATABASE_PASSWORD}@debrief-postgres:5432/debrief_production
      NODE_ENV: production
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      S3_ENDPOINT: http://debrief-minio:9000
      S3_ACCESS_KEY: debrief_user
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
