services:
  # --- PostgreSQL 18 Core Engine ---
  postgres:
    image: postgres:18-alpine
    container_name: debrief-postgres
    restart: always
    environment:
      POSTGRES_USER: debrief_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: debrief_production
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - dokploy-network
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debrief_user -d debrief_production"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- Flat, Instant Database Migrator ---
  db-migrate:
    image: ghcr.io/branislavjuhaas/dn-debrief-web:latest
    pull_policy: always
    container_name: debrief-migrator
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://debrief_user:${DATABASE_PASSWORD}@postgres:5432/debrief_production
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy

  # --- MinIO S3 Object Storage Engine ---
  minio:
    image: minio/minio:latest
    container_name: debrief-minio
    restart: always
    environment:
      MINIO_ROOT_USER: debrief_user
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - dokploy-network
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console Dashboard
    healthcheck:
      test:
        ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # --- MinIO Provisioner & Permissions Sidecar ---
  minio-init:
    image: minio/mc:latest
    container_name: debrief-minio-init
    networks:
      - dokploy-network
    environment:
      MINIO_ROOT_USER: debrief_user
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://debrief-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb --ignore-existing myminio/debrief;
      /usr/bin/mc anonymous set-json '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicReadAvatarsAndEvents\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::debrief/avatars/*\",\"arn:aws:s3:::debrief/events/*\"]}]}' myminio/debrief;
      exit 0;
      "

  # --- Nuxt Server ---
  web:
    image: ghcr.io/branislavjuhaas/dn-debrief-web:latest
    pull_policy: always
    container_name: debrief-web
    restart: always
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      DATABASE_URL: postgresql://debrief_user:${DATABASE_PASSWORD}@postgres:5432/debrief_production
      NODE_ENV: production
      # OAuth Credentials
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # S3 / MinIO Configuration
      S3_ENDPOINT: http://debrief-minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY_ID: debrief_user
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # AWS SES Configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_FROM_EMAIL: ${AWS_FROM_EMAIL}
      AWS_FROM_NAME: ${AWS_FROM_NAME}
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
