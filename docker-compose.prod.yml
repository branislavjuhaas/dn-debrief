services:
  # --- PostgreSQL 18 Core Engine ---
  postgres:
    image: postgres:18-alpine
    container_name: debrief-postgres
    restart: always
    environment:
      POSTGRES_USER: debrief_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: debrief_production
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - dokploy-network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debrief_user -d debrief_production"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- Flat, Instant Database Migrator ---
  db-migrate:
    image: ghcr.io/branislavjuhaas/dn-debrief-web:latest
    pull_policy: always
    container_name: debrief-migrator
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://debrief_user:${DATABASE_PASSWORD}@postgres:5432/debrief_production
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy

  # --- RustFS Volume Permission Fixer ---
  rustfs-permission-helper:
    image: alpine:latest
    container_name: debrief-rustfs-permission-helper
    volumes:
      - miniodata:/data
      - rustfs_logs:/app/logs
    command: >
      sh -c "
        chown -R 10001:10001 /data /app/logs &&
        echo 'Volume Permissions fixed' &&
        exit 0
      "
    networks:
      - dokploy-network
    restart: "no"

  # --- RustFS S3 Object Storage Engine ---
  rustfs:
    image: rustfs/rustfs:latest
    container_name: debrief-rustfs
    restart: always
    depends_on:
      rustfs-permission-helper:
        condition: service_completed_successfully
    security_opt:
      - "no-new-privileges:true"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=debrief_user
      - RUSTFS_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs
    volumes:
      - miniodata:/data
      - rustfs_logs:/app/logs
    networks:
      - dokploy-network
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console Dashboard
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- RustFS Provisioner & Permissions Sidecar ---
  rustfs-init:
    image: rustfs/rc:latest
    container_name: debrief-rustfs-init
    networks:
      - dokploy-network
    environment:
      RUSTFS_ROOT_USER: debrief_user
      RUSTFS_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      rc alias set myrustfs http://debrief-rustfs:9000 $$RUSTFS_ROOT_USER $$RUSTFS_ROOT_PASSWORD;
      rc mb --ignore-existing myrustfs/debrief;
      rc anonymous set download myrustfs/debrief;
      echo '{\"rules\":[{\"allowedOrigins\":[\"*\"],\"allowedMethods\":[\"GET\",\"PUT\",\"POST\",\"DELETE\",\"HEAD\"],\"allowedHeaders\":[\"*\"],\"exposeHeaders\":[\"ETag\"]}]}' > /tmp/cors.json;
      rc cors set myrustfs/debrief /tmp/cors.json;
      exit 0;
      "

  # --- Nuxt Server ---
  web:
    image: ghcr.io/branislavjuhaas/dn-debrief-web:latest
    pull_policy: always
    container_name: debrief-web
    restart: always
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      DATABASE_URL: postgresql://debrief_user:${DATABASE_PASSWORD}@postgres:5432/debrief_production
      NODE_ENV: production
      # OAuth Credentials
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # S3 / RustFS Configuration
      S3_ENDPOINT: http://debrief-rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY_ID: debrief_user
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # AWS SES Configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_FROM_EMAIL: ${AWS_FROM_EMAIL}
      AWS_FROM_NAME: ${AWS_FROM_NAME}
      # STRIPE Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  rustfs_logs:
    driver: local
