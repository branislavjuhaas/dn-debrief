allowBuilds:
  esbuild: true
  vue-demi: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
minimumReleaseAgeExclude:
  - "@nuxt/kit@4.6.2"
  - "@nuxt/nitro-server@4.6.2"
  - "@nuxt/schema@4.6.2"
  - "@nuxt/vite-builder@4.6.2"
  - "@nuxt/vite-server@4.6.2"
  - nuxt@4.6.2
overrides:
  vite: "catalog:"
  # Security patches that the tarball of vite-plus 0.2.8 pins below the fixed
  # versions. Remove them once vite-plus ships vitest >= 4.1.12.
  vitest: 4.1.12
  "@vitest/browser": 4.1.12
  "@vitest/browser-preview": 4.1.12
  "@vitest/expect": 4.1.12
  "@vitest/mocker": 4.1.12
  "@vitest/pretty-format": 4.1.12
  "@vitest/runner": 4.1.12
  "@vitest/snapshot": 4.1.12
  "@vitest/spy": 4.1.12
  "@vitest/utils": 4.1.12
  tinypool: 2.1.2
  node-forge: 1.4.3
  serialize-javascript: 7.1.3
  source-map-js: 1.2.2
  "@tiptap/core": "3.32.0"
  "@tiptap/extension-text-align": "3.32.0"
  "@tiptap/vue-3": "3.32.0"
  "@tiptap/pm": "3.32.0"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
